<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAWFIIK HOST - PS4 JB 13.2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    body {
      background: radial-gradient(circle at center, #10141d 0%, #05070a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    header { text-align: center; margin-top: 10px; z-index: 2; }
    header h1 {
      font-size: 3rem;
      color: #00d4ff;
      text-shadow: 0 0 20px #00d4ff, 0 0 40px #0052d4;
      letter-spacing: 2px;
    }
    header p { font-size: 1.2rem; color: #a0aec0; }

    .container {
      width: 100%;
      max-width: 850px;
      background: rgba(15, 20, 30, 0.85);
      border: 2px solid rgba(0, 212, 255, 0.4);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
      backdrop-filter: blur(10px);
      text-align: center;
      margin: 20px 0;
      z-index: 2;
    }

    .status-box {
      background: #090c10;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 15px;
      font-size: 1.2rem;
      color: #58a6ff;
      margin-bottom: 25px;
      transition: all 0.5s ease;
    }

    .btn {
      background: linear-gradient(45deg, #e60000, #ff4d4d);
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(230, 0, 0, 0.6);
      transition: all 0.3s ease;
      margin: 10px;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255, 77, 77, 0.9);
    }

    /* أنيميشن سبايدرمان والشبكة */
    .spidey-container {
      position: fixed;
      top: -350px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 999;
      pointer-events: none;
      transition: top 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .web-line {
      width: 3px;
      height: 180px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
      box-shadow: 0 0 8px #fff;
    }

    .spidey-card {
      background: #111;
      border: 3px solid #e60000;
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 30px #e60000, inset 0 0 15px #fff;
      position: relative;
    }

    .spidey-card img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .zamalek-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #fff;
      color: #e60000;
      font-weight: 900;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid #e60000;
    }

    /* الحركة عند التفعيل */
    .spidey-active {
      top: 50px !important;
    }

    footer {
      text-align: center;
      font-size: 1.1rem;
      color: #8b949e;
      z-index: 2;
    }
    .whatsapp-link {
      color: #25d366;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <!-- أنيميشن سبايدرمان المتدلي بالشبكة -->
  <div class="spidey-container" id="spideyBox">
    <div class="web-line"></div>
    <div class="spidey-card">
      <img src="https://images.unsplash.com/photo-1604200213928-ba3cf4fc8436?w=400&auto=format&fit=crop" alt="Spider-Man">
      <div class="zamalek-badge">Zamalek SC</div>
    </div>
  </div>

  <header>
    <h1>TAWFIIK HOST</h1>
    <p>صفحة تهكير PS4 - الإصدار 13.2</p>
  </header>

  <div class="container">
    <div class="status-box" id="status">
      حالة الثغرة: جاهز للتشغيل... اضغط على "تفعيل GoldHEN"
    </div>

    <button class="btn" onclick="triggerSpiderHEN()">🕷️ تفعيل GoldHEN 13.2</button>
  </div>

  <footer>
    للدعم والتواصل واتساب: 
    <a class="whatsapp-link" href="https://wa.me/201011457707" target="_blank">01011457707</a>
  </footer>

  <script>
    function triggerSpiderHEN() {
      const spidey = document.getElementById('spideyBox');
      const status = document.getElementById('status');

      status.innerText = '🕷️ جاري إرسال الشبكة وتفعيل الـ GoldHEN...';
      status.style.borderColor = '#e60000';
      status.style.boxShadow = '0 0 20px rgba(230, 0, 0, 0.5)';

      spidey.classList.add('spidey-active');

      setTimeout(() => {
        status.innerText = '✅ تم تفعيل GoldHEN بنجاح! استمتع بالألعاب';
        status.style.color = '#25d366';
        status.style.borderColor = '#25d366';
        status.style.boxShadow = '0 0 25px rgba(37, 211, 102, 0.6)';
      }, 1500);

      setTimeout(() => {
        spidey.classList.remove('spidey-active');
      }, 5000);
    }
  </script>
</body>
</html>

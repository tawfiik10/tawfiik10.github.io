<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAWFIIK HOST - PS4 JB 13.2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)), url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
      overflow-x: hidden;
      position: relative;
    }

    header { text-align: center; margin-top: 15px; z-index: 2; }
    header h1 {
      font-size: 3.8rem;
      font-weight: 900;
      color: #00d4ff;
      text-shadow: 0 0 25px #00d4ff, 0 0 50px #0052d4, 0 0 10px #000;
      letter-spacing: 4px;
    }
    header p { 
      font-size: 1.4rem; 
      color: #e0e0e0; 
      margin-top: 5px; 
      text-shadow: 0 0 10px #000;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: rgba(10, 15, 25, 0.75);
      border: 2px solid rgba(0, 212, 255, 0.6);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 0 50px rgba(0, 212, 255, 0.4), inset 0 0 20px rgba(0, 212, 255, 0.2);
      backdrop-filter: blur(10px);
      text-align: center;
      margin: 20px 0;
      z-index: 2;
    }

    .status-box {
      background: rgba(5, 8, 14, 0.9);
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 15px;
      padding: 20px;
      font-size: 1.3rem;
      color: #00d4ff;
      margin-bottom: 25px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
      transition: all 0.5s ease;
      font-weight: bold;
    }

    .btn {
      background: linear-gradient(45deg, #e60000, #ff3333);
      color: #fff;
      border: 2px solid #fff;
      padding: 18px 55px;
      font-size: 1.5rem;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(230, 0, 0, 0.9), 0 0 10px #fff;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 50px rgba(255, 51, 51, 1), 0 0 20px #fff;
    }

    /* --- أنيميشن سبايدرمان الكامل بدون مربع --- */
    .spidey-container {
      position: fixed;
      top: -500px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 999;
      pointer-events: none;
      transition: top 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .web-line {
      width: 3px;
      height: 220px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(255,255,255,0.3));
      box-shadow: 0 0 12px #fff;
    }

    .spidey-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spidey-wrapper img {
      width: 220px; /* حجم كبير وواضح لسبايدرمان */
      height: auto;
      filter: drop-shadow(0 0 25px rgba(230, 0, 0, 0.9));
    }

    .zamalek-badge {
      margin-top: -15px;
      background: #fff;
      color: #e60000;
      font-weight: 900;
      font-size: 1rem;
      padding: 5px 18px;
      border-radius: 20px;
      border: 2px solid #e60000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 10px #e60000;
      letter-spacing: 1px;
    }

    .spidey-active {
      top: 20px !important;
    }

    footer {
      text-align: center;
      font-size: 1.2rem;
      color: #fff;
      z-index: 2;
      text-shadow: 0 0 8px #000;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 20px;
      border-radius: 20px;
    }
    
    .whatsapp-link {
      color: #25d366;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.4rem;
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <!-- أنيميشن سبايدرمان المتدلي بالشبكة بدون مربع -->
  <div class="spidey-container" id="spideyBox">
    <div class="web-line"></div>
    <div class="spidey-wrapper">
      <img src="https://pngimg.com/uploads/spider_man/spider_man_PNG12.png" alt="Spider-Man">
      <div class="zamalek-badge">ZAMALEK SC</div>
    </div>
  </div>

  <header>
    <h1>TAWFIIK HOST</h1>
    <p>صفحة تهكير PS4 - الإصدار 13.2</p>
  </header>

  <div class="container">
    <div class="status-box" id="status">
      حالة الثغرة: جاهز للتشغيل... اضغط على "تفعيل GoldHEN"
    </div>

    <button class="btn" onclick="triggerSpiderHEN()">🕷️ تفعيل GoldHEN 13.2</button>
  </div>

  <footer>
    للدعم والتواصل واتساب: 
    <a class="whatsapp-link" href="https://wa.me/201011457707" target="_blank">01011457707</a>
  </footer>

  <script>
    function triggerSpiderHEN() {
      const spidey = document.getElementById('spideyBox');
      const status = document.getElementById('status');

      status.innerText = '🕷️ جاري إرسال الشبكة وتفعيل الـ GoldHEN...';
      status.style.borderColor = '#e60000';
      status.style.color = '#ff4d4d';
      status.style.boxShadow = '0 0 25px rgba(230, 0, 0, 0.7)';

      spidey.classList.add('spidey-active');

      setTimeout(() => {
        status.innerText = '✅ تم تفعيل GoldHEN بنجاح! استمتع بالألعاب';
        status.style.color = '#25d366';
        status.style.borderColor = '#25d366';
        status.style.boxShadow = '0 0 30px rgba(37, 211, 102, 0.7)';
      }, 1500);

      setTimeout(() => {
        spidey.classList.remove('spidey-active');
      }, 5000);
    }
  </script>
</body>
</html>

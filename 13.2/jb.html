
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAWFIIK - لصيانة البلايستيشن</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f;
      color: #fff;
      font-family: 'Cairo', 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      background: radial-gradient(circle at center, #16192b 0%, #08090e 100%);
      border: 3px solid #00439c;
      border-radius: 24px;
      box-shadow: 0 0 50px rgba(0, 112, 209, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.8);
      padding: 40px;
      position: relative;
      text-align: center;
    }
    .header-tag {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .main-title {
      font-size: 4rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px #0070d1, 0 0 40px #0070d1;
      margin-bottom: 10px;
    }
    .sub-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #00f0ff;
      margin-bottom: 15px;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #0070d1, #00d2ff);
      color: #fff;
      padding: 8px 30px;
      border-radius: 50px;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 35px;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .service-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      padding: 25px 15px;
      transition: all 0.3s ease;
    }
    .service-card:hover {
      transform: translateY(-5px);
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    .service-card i {
      font-size: 2.5rem;
      color: #00f0ff;
      margin-bottom: 15px;
    }
    .service-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-size: 2rem;
      font-weight: 900;
      padding: 15px 40px;
      border-radius: 60px;
      box-shadow: 0 0 30px rgba(37, 211, 102, 0.5);
      transition: all 0.3s ease;
      margin-bottom: 30px;
    }
    .contact-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(37, 211, 102, 0.8);
    }
    .ps-symbols {
      display: flex;
      justify-content: center;
      gap: 30px;
      font-size: 2.2rem;
      margin-top: 10px;
    }
    .ps-symbols span:nth-child(1) { color: #00f0ff; }
    .ps-symbols span:nth-child(2) { color: #ff4d4d; }
    .ps-symbols span:nth-child(3) { color: #9b51e0; }
    .ps-symbols span:nth-child(4) { color: #2ea44f; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-tag">PlayStation Service Center</div>
    <h1 class="main-title">TAWFIIK</h1>
    <div class="sub-title">لصيانة البلايستيشن</div>
    <div class="badge">خبرة .. دقة .. ثقة</div>

    <div class="services-grid">
      <div class="service-card">
        <i class="fa-solid fa-cogs"></i>
        <h3>صيانة شاملة</h3>
      </div>
      <div class="service-card">
        <i class="fa-solid fa-wrench"></i>
        <h3>إصلاح الأعطال</h3>
      </div>
      <div class="service-card">
        <i class="fa-solid fa-broom"></i>
        <h3>تنظيف داخلي وتغيير معجون حراري</h3>
      </div>
      <div class="service-card">
        <i class="fa-solid fa-rotate"></i>
        <h3>تحديث الأنظمة</h3>
      </div>
    </div>

    <a href="https://wa.me/201011457707" class="contact-btn" target="_blank">
      <i class="fa-brands fa-whatsapp"></i>
      <span>01011457707</span>
    </a>

    <div class="ps-symbols">
      <span>▲</span>
      <span>◯</span>
      <span>✕</span>
      <span>▢</span>
    </div>
  </div>

</body>
</html>
